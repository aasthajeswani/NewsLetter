name: StudyIQ Daily Newsletter

on:
  schedule:
    - cron: '30 17 * * *'   # 8:00 AM IST (UTC+5:30)
  workflow_dispatch:        # manual trigger button

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show requirements.txt
        run: cat requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      
      - name: Show package versions
        run: |
          pip show groq
          pip show httpx
          pip show httpcore

      - name: Run agent
        env:
          YOUTUBE_API_KEY:    ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          SUPADATA_API_KEY_1: ${{ secrets.SUPADATA_API_KEY_1 }}
          SUPADATA_API_KEY_2: ${{ secrets.SUPADATA_API_KEY_2 }}
          EMAIL_FROM:         ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          WEBSHARE_USER: ${{ secrets.WEBSHARE_USER }}
          WEBSHARE_PASS: ${{ secrets.WEBSHARE_PASS }}
        run: python agent.py
